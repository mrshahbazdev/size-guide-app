<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="shopify-api-key" content="{{API_KEY}}">
  <title>Size Guide + Fit Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
  <div class="max-w-6xl mx-auto px-6 py-8">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Size Guide + Fit Finder</h1>
        <p class="text-sm text-gray-500 mt-1">Connected shop: <span class="font-medium text-gray-700">{{SHOP}}</span></p>
      </div>
      <div class="flex items-center gap-3">
        <span id="statusBadge" class="inline-flex items-center rounded-full bg-green-100 px-3 py-1 text-xs font-medium text-green-700">Installed</span>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="border-b border-gray-200">
        <nav class="flex" aria-label="Tabs">
          <button onclick="showTab('charts')" id="tab-charts" class="tab-btn flex-1 px-6 py-4 text-sm font-medium border-b-2 border-green-600 text-green-700 bg-green-50/50">Size Charts</button>
          <button onclick="showTab('fitfinder')" id="tab-fitfinder" class="tab-btn flex-1 px-6 py-4 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-50">Fit Finder</button>
        </nav>
      </div>

      <div class="p-6">
        <div id="panel-charts" class="panel">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold">Size Charts</h2>
            <button onclick="resetChartForm()" class="text-sm text-green-700 font-medium hover:underline">+ New Chart</button>
          </div>

          <form id="chartForm" class="bg-gray-50 rounded-lg border border-gray-200 p-5 mb-6 hidden">
            <input type="hidden" id="chartId">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Chart name</label>
                <input id="chartName" required class="w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm px-3 py-2 border">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Unit</label>
                <input id="chartUnit" value="cm" class="w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm px-3 py-2 border">
              </div>
            </div>
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Headers (comma separated)</label>
              <input id="chartHeaders" placeholder="Chest, Waist, Hips" class="w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm px-3 py-2 border">
            </div>
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Rows (JSON array)</label>
              <textarea id="chartRows" rows="5" placeholder='[{"size":"S","values":["88-92","72-76","92-96"]}]' class="w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm px-3 py-2 border font-mono"></textarea>
              <p class="text-xs text-gray-500 mt-1">Each row needs size and values matching the headers count.</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Apply to</label>
                <select id="chartApplyTo" class="w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm px-3 py-2 border">
                  <option value="all">All products</option>
                  <option value="types">Product types</option>
                  <option value="tags">Tags</option>
                  <option value="products">Specific products</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Match values (comma separated)</label>
                <input id="chartMatch" placeholder="Shirt, T-Shirt" class="w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm px-3 py-2 border">
              </div>
            </div>
            <div class="flex items-center gap-3">
              <button type="submit" class="inline-flex justify-center rounded-md bg-green-700 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-green-800 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">Save Chart</button>
              <button type="button" onclick="document.getElementById('chartForm').classList.add('hidden')" class="text-sm text-gray-600 hover:text-gray-900">Cancel</button>
            </div>
          </form>

          <div id="chartList" class="overflow-x-auto rounded-lg border border-gray-200">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                  <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Unit</th>
                  <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Applies To</th>
                  <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Match</th>
                  <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
              </thead>
              <tbody id="chartTableBody" class="bg-white divide-y divide-gray-200"></tbody>
            </table>
          </div>
        </div>

        <div id="panel-fitfinder" class="panel hidden">
          <h2 class="text-lg font-semibold mb-4">Fit Finder</h2>
          <form id="fitForm" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Questions (JSON array)</label>
              <textarea id="fitQuestions" rows="6" placeholder='[{"text":"How do you prefer your fit?","options":["Tight","Regular","Loose"]}]' class="w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm px-3 py-2 border font-mono"></textarea>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Results (JSON array)</label>
              <textarea id="fitResults" rows="6" placeholder='[{"size":"S","scores":[0,0]},{"size":"M","scores":[1,1]},{"size":"L","scores":[2,2]}]' class="w-full rounded-md border-gray-300 shadow-sm focus:border-green-500 focus:ring-green-500 sm:text-sm px-3 py-2 border font-mono"></textarea>
            </div>
            <div class="flex items-center gap-3">
              <button type="submit" class="inline-flex justify-center rounded-md bg-green-700 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-green-800 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">Save Fit Finder</button>
              <span id="fitStatus" class="text-sm text-gray-500"></span>
            </div>
          </form>
          <div id="fitPreview" class="mt-6 bg-gray-50 rounded-lg border border-gray-200 p-4 hidden">
            <h3 class="text-sm font-semibold text-gray-700 mb-2">Live Preview</h3>
            <div id="fitPreviewContent" class="text-sm text-gray-600"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-gray-900 text-white px-4 py-3 rounded-lg shadow-lg text-sm"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const qs = window.location.search;

    function showTab(id) {
      document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
      document.getElementById('panel-' + id).classList.remove('hidden');
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('border-green-600', 'text-green-700', 'bg-green-50/50');
        b.classList.add('border-transparent', 'text-gray-500');
      });
      const active = document.getElementById('tab-' + id);
      active.classList.remove('border-transparent', 'text-gray-500');
      active.classList.add('border-green-600', 'text-green-700', 'bg-green-50/50');
    }

    function toast(message, type = 'info') {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.className = `fixed bottom-5 right-5 transform transition-all duration-300 px-4 py-3 rounded-lg shadow-lg text-sm ${type === 'error' ? 'bg-red-700' : 'bg-gray-900'} text-white`;
      el.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => el.classList.add('translate-y-20', 'opacity-0'), 3000);
    }

    async function api(path, opts = {}) {
      const url = path + qs;
      const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
      const res = await fetch(url, { ...opts, headers });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(text);
      }
      return res.json();
    }

    function resetChartForm() {
      document.getElementById('chartForm').classList.remove('hidden');
      document.getElementById('chartForm').reset();
      document.getElementById('chartId').value = '';
      document.getElementById('chartUnit').value = 'cm';
      document.getElementById('chartApplyTo').value = 'all';
    }

    function renderCharts(charts) {
      const tbody = document.getElementById('chartTableBody');
      if (!charts.length) {
        document.getElementById('chartList').innerHTML = '<div class="p-8 text-center text-gray-500 text-sm">No size charts yet. Click <span class="font-medium text-green-700">+ New Chart</span> to create one.</div>';
        return;
      }
      tbody.innerHTML = charts.map(c => `
        <tr>
          <td class="px-4 py-3 text-sm font-medium text-gray-900">${escapeHtml(c.name || 'Untitled')}</td>
          <td class="px-4 py-3 text-sm text-gray-600">${escapeHtml(c.unit || '-')}</td>
          <td class="px-4 py-3 text-sm text-gray-600 capitalize">${escapeHtml(c.apply_to || 'all')}</td>
          <td class="px-4 py-3 text-sm text-gray-600">${escapeHtml(c.apply_to === 'types' ? c.types : c.apply_to === 'tags' ? c.tags : c.products || '—')}</td>
          <td class="px-4 py-3 text-right text-sm font-medium">
            <button onclick="editChart(${JSON.stringify(c).replace(/"/g, '&quot;')})" class="text-green-700 hover:text-green-900 mr-3">Edit</button>
            <button onclick="deleteChart('${c.id}')" class="text-red-600 hover:text-red-900">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function escapeHtml(text) {
      if (text == null) return '';
      return String(text).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    window.editChart = function(c) {
      resetChartForm();
      document.getElementById('chartId').value = c.id || '';
      document.getElementById('chartName').value = c.name || '';
      document.getElementById('chartUnit').value = c.unit || 'cm';
      document.getElementById('chartHeaders').value = (c.headers || []).join(', ');
      document.getElementById('chartRows').value = JSON.stringify(c.rows || [], null, 2);
      document.getElementById('chartApplyTo').value = c.apply_to || 'all';
      const match = c.apply_to === 'types' ? c.types : c.apply_to === 'tags' ? c.tags : c.products;
      document.getElementById('chartMatch').value = match || '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteChart = async function(id) {
      if (!confirm('Are you sure you want to delete this chart?')) return;
      try {
        await api('/api/size-charts/' + id, { method: 'DELETE' });
        toast('Chart deleted');
        loadCharts();
      } catch (e) { toast(e.message || 'Delete failed', 'error'); }
    };

    document.getElementById('chartForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const id = document.getElementById('chartId').value;
        const applyTo = document.getElementById('chartApplyTo').value;
        const body = {
          id,
          name: document.getElementById('chartName').value,
          unit: document.getElementById('chartUnit').value,
          headers: document.getElementById('chartHeaders').value.split(',').map(s => s.trim()).filter(Boolean),
          rows: JSON.parse(document.getElementById('chartRows').value || '[]'),
          apply_to: applyTo,
          types: applyTo === 'types' ? document.getElementById('chartMatch').value : '',
          tags: applyTo === 'tags' ? document.getElementById('chartMatch').value : '',
          products: applyTo === 'products' ? document.getElementById('chartMatch').value : ''
        };
        await api(id ? '/api/size-charts/' + id : '/api/size-charts', {
          method: id ? 'PUT' : 'POST',
          body: JSON.stringify(body)
        });
        document.getElementById('chartForm').classList.add('hidden');
        toast(id ? 'Chart updated' : 'Chart saved');
        loadCharts();
      } catch (err) { toast(err.message || 'Save failed', 'error'); }
    });

    async function loadCharts() {
      try {
        const { charts } = await api('/api/size-charts');
        renderCharts(charts);
      } catch (e) { toast(e.message || 'Failed to load charts', 'error'); }
    }

    async function loadFitFinder() {
      try {
        const { finder } = await api('/api/fit-finder');
        if (finder) {
          document.getElementById('fitQuestions').value = JSON.stringify(finder.questions || [], null, 2);
          document.getElementById('fitResults').value = JSON.stringify(finder.results || [], null, 2);
          renderFitPreview(finder.questions, finder.results);
        }
      } catch (e) { toast(e.message || 'Failed to load fit finder', 'error'); }
    }

    function renderFitPreview(questions, results) {
      const preview = document.getElementById('fitPreview');
      const content = document.getElementById('fitPreviewContent');
      if (!questions || !questions.length) { preview.classList.add('hidden'); return; }
      let html = '<ol class="list-decimal pl-4 space-y-2">' + questions.map(q => `
        <li>${escapeHtml(q.text)}<div class="flex flex-wrap gap-2 mt-1">${q.options.map(o => `<span class="px-2 py-1 bg-white border rounded text-xs">${escapeHtml(o)}</span>`).join('')}</div></li>
      `).join('') + '</ol>';
      html += '<div class="mt-3 font-medium">Recommended sizes: ' + (results || []).map(r => `<span class="px-2 py-1 bg-green-100 text-green-800 rounded text-xs">${escapeHtml(r.size)}</span>`).join(' ') + '</div>';
      content.innerHTML = html;
      preview.classList.remove('hidden');
    }

    document.getElementById('fitForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const questions = JSON.parse(document.getElementById('fitQuestions').value || '[]');
        const results = JSON.parse(document.getElementById('fitResults').value || '[]');
        await api('/api/fit-finder', { method: 'POST', body: JSON.stringify({ questions, results }) });
        document.getElementById('fitStatus').textContent = 'Saved';
        renderFitPreview(questions, results);
        toast('Fit finder saved');
        setTimeout(() => document.getElementById('fitStatus').textContent = '', 2000);
      } catch (err) { toast(err.message || 'Save failed', 'error'); }
    });

    loadCharts();
    loadFitFinder();
  </script>
</body>
</html>
